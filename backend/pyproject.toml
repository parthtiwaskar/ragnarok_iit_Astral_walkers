[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nine-realms"
version = "0.1.0"
description = "Trial of the Nine Realms: an adversarial four-agent supply-chain disruption analyser over the Runemark corpus"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sse-starlette>=2.0",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "pymupdf>=1.24",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "charset-normalizer>=3.3",
  "ftfy>=6.2",
  "rapidfuzz>=3.6",
  "watchdog>=4.0",
  "structlog>=24.1",
  "tenacity>=8.2",
  "openai>=1.30",
  "anthropic>=0.30",
]

[project.optional-dependencies]
embeddings = ["fastembed>=0.3"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "httpx>=0.27",
  "ruff>=0.4",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["agents/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["chaos: damaged-file and fault-injection tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
