services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      RUNEMARK_DIR: /workspace/data/runemark
      DB_PATH: /workspace/data/index/runemark.sqlite
      VECTORS_DIR: /workspace/data/index
      RUNS_DIR: /workspace/runs
    volumes:
      - ./:/workspace
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
